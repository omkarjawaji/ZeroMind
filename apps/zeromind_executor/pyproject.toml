[project]
name = "zeromind-executor"
version = "0.1.0"
description = "ZeroMind execution plane: policy engine, approval UI, guarded order execution (localhost only)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeromind_executor"]
