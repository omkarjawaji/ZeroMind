[project]
name = "zeromind-workspace"
version = "0.0.0"
description = "ZeroMind monorepo (dev workspace; each app is deployed on its own)."
requires-python = ">=3.11"
dependencies = [
    "zeromind",
    "zeromind-executor",
    "papertrade",
    "announcements-mcp",
    "kite-readonly-proxy",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
zeromind = { workspace = true }
zeromind-executor = { workspace = true }
papertrade = { workspace = true }
announcements-mcp = { workspace = true }
kite-readonly-proxy = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "zeromind",
    "zeromind_executor",
    "papertrade",
    "announcements_mcp",
    "kite_readonly_proxy",
]
